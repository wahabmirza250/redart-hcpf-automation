name: Colorado pyx12 validator

on:
  push:
    branches:
      - feature/colorado-pyx12-validation
    paths:
      - "edi-validator/**"
      - ".github/workflows/colorado-pyx12-validator.yml"
  pull_request:
    paths:
      - "edi-validator/**"
      - ".github/workflows/colorado-pyx12-validator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edi-validator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q
